<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clayface_aScene</title>
<style>
html,body{margin:0;height:100%;background:#050304;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,calc(100vh*16/9));height:auto;display:block;background:#000}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script src="balance.js"></script>
<script>
'use strict';
// ================= 설정 =================
const W=960,H=540,GY=400,PX=150,U=2.5;
const HP=new URLSearchParams(location.hash.slice(1));
// 밸런스·대사: balance.js 기본값 위에, balance.html에서 저장한 값(이 브라우저만)을 덮어씀
if(!window.BALANCE_DEFAULT){const x=document.getElementById('c').getContext('2d');x.fillStyle='#fff';x.font='20px sans-serif';x.fillText('balance.js 파일을 찾을 수 없어요 — index.html과 같은 폴더에 있어야 해요.',40,270);throw new Error('balance.js 없음')}
const BAL=(()=>{
  const d=JSON.parse(JSON.stringify(window.BALANCE_DEFAULT));let o=null;
  try{if(!HP.has('nobal'))o=JSON.parse(localStorage.getItem('clayface_balance')||'null')}catch(e){}
  const merge=(a,b)=>{for(const k in b)a[k]=(a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])&&b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k]))?merge(a[k],b[k]):b[k];return a};
  window.BAL_CUSTOM=!!o;return o?merge(d,o):d;
})();
const CFG={
  spacing:105,     // 팀 안 NPC 간격(px)
  teamGap:210,     // 팀 사이 간격(px)
  lead:1.1,        // 시작 후 첫 NPC 등장까지(초)
  after:2.7,       // 구간의 마지막 NPC가 지나간 뒤 검문까지(초)
  hold:1.6,        // 검문 통과 후 멈춰 있는 시간(초)
  segGap:2.25,     // 검문 통과 후 다음 구간 첫 NPC가 플레이어에게 닿기까지(초)
  cool:BAL.cfg.cool,       // 변신 쿨타임(초)
  harden:BAL.cfg.harden,   // 변신 후 얼굴이 굳기 시작하는 시간(초)
  crumble:BAL.cfg.crumble, // 변장이 무너지는 시간(초)
  darken:.68,      // 실루엣 어둡기
};
const FONT='Georgia,"Batang","Nanum Myeongjo",serif';
const KEYS=['A','S','D','F'];
const MORPH=1.0;   // 변신 연출 시간(초)
const STAIR_T=7.8; // 계단 괴물화 연출 시간(초)

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function shade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.min(255,Math.round(v*k)).toString(16).padStart(2,'0');return'#'+f(n>>16)+f(n>>8&255)+f(n&255)}

// ================= 인물 그리기 (발 = 원점, 키 약 100) =================
let PXU=1;
function P(g,col,path){g.beginPath();path();g.fillStyle=col;g.fill()}
const RR=(g,x,y,w,h,r)=>()=>g.roundRect(x,y,w,h,r);
const EL=(g,x,y,rx,ry)=>()=>g.ellipse(x,y,rx,ry,0,0,Math.PI*2);
const PL=(g,p)=>()=>{g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath()};

function person(g,p,ph){
  const f=p.sex==='f',d=p.face||-1,skin=p.skin,sw=f?12:16,t=p.top;
  const a=Math.sin(ph*Math.PI*2),la=a*.27;
  g.translate(0,-Math.abs(a)*1.5);
  if(p.hair==='long')P(g,p.hairCol,RR(g,-9.5,-101,19,30,7));
  // 다리
  const leg=(s,an)=>{g.save();
    if(t==='dress'){g.translate(s*4.75,-30);g.rotate(an*.6);P(g,skin,RR(g,-2.25,0,4.5,27,2));P(g,p.shoe,PL(g,[-3+d,27,3+d,27,4+d,30,-3+d,30]))}
    else{g.translate(s*6.5,-50);g.rotate(an);P(g,p.pants,PL(g,[-5.5,0,5.5,0,4.5,47,-4.5,47]));
      if(t==='track')P(g,p.stripe,RR(g,s>0?3.6:-4.6,1,1,44,0));
      P(g,p.shoe,RR(g,-6.5+d,45.5,12,4.5,2))}
    g.restore()};
  leg(-1,la);leg(1,-la);
  // 팔
  const armCol=(t==='dress'||t==='tee'||t==='party')?skin:t==='vest'?p.shirt:p.topCol;
  const arm=(s,an)=>{g.save();g.translate(s*(sw+2),-77);
    const aim=p.aim&&s===d; // 총을 겨눈 팔은 앞으로 뻗음
    g.rotate(aim?-d*Math.PI*.47:an);
    P(g,armCol,RR(g,-3.5,-2,7,31,3.5));
    if(t==='tee'||t==='party')P(g,p.topCol,RR(g,-3.5,-2,7,10,3));
    if(t==='track')P(g,p.stripe,RR(g,s>0?2:-3,0,1,28,0));
    if(aim){P(g,'#8a8a92',RR(g,-1.6,31,3.2,11,.5));P(g,'#6a6a72',RR(g,-1.6,29,3.2,4,.5))}
    P(g,skin,EL(g,0,30.5,3.4,3.8));
    g.restore()};
  arm(-1,-la*.7);arm(1,la*.7);
  // 몸통
  if(t==='dress'){
    P(g,p.topCol,PL(g,[-11,-58,11,-58,17,-25,-17,-25]));
    P(g,skin,PL(g,[-11,-80,11,-80,10,-73,-10,-73]));
    P(g,p.topCol,PL(g,[-10,-75,10,-75,9,-56,-9,-56]));
    P(g,'#d8d0c0',EL(g,0,-78,1.6,1.6));
  }else{
    const w=t==='hoodie'?(f?14:17):sw;
    P(g,t==='vest'?p.shirt:p.topCol,PL(g,[-w,-80,w,-80,w-3,-46,-w+3,-46]));
  }
  P(g,skin,RR(g,-3,-87,6,8,2));
  if(t==='hoodie'){
    P(g,p.topDark,EL(g,0,-80,10,4));P(g,p.topDark,RR(g,-8,-62,16,9,3));
    g.strokeStyle='#d8d8d8';g.lineWidth=Math.max(.8,PXU);g.beginPath();g.moveTo(-2.5,-79);g.lineTo(-3,-70);g.moveTo(2.5,-79);g.lineTo(3,-70);g.stroke();
  }
  if(t==='suit'){
    P(g,p.shirt||'#e8e6e0',PL(g,[-5,-80,5,-80,0,-63]));
    P(g,skin,PL(g,[-2,-80,2,-80,0,-76]));
    P(g,p.topDark,PL(g,[-5,-80,-1,-65,-7,-72]));P(g,p.topDark,PL(g,[5,-80,1,-65,7,-72]));
  }
  if(t==='vest'){ // 바텐더: 흰 셔츠 + 검은 조끼 + 나비넥타이
    P(g,p.topCol,PL(g,[-sw+1.5,-79,-3,-79,0,-60,3,-79,sw-1.5,-79,sw-3,-46,-sw+3,-46]));
    g.fillStyle='#8a8a90';for(let y=-58;y<-47;y+=4.5)g.fillRect(-.7,y,1.4,1.4);
    P(g,'#0a0a0c',PL(g,[-4,-81.5,0,-79.5,-4,-77.5]));P(g,'#0a0a0c',PL(g,[4,-81.5,0,-79.5,4,-77.5]));
  }
  if(t==='party'||p.sparkle){ // 파티 셔츠 무늬 · 드레스 반짝이 (몸통 안쪽에만)
    g.save();g.beginPath();
    if(t==='dress'){PL(g,[-10,-75,10,-75,9,-56,-9,-56])();PL(g,[-11,-58,11,-58,17,-25,-17,-25])()}else PL(g,[-sw,-80,sw,-80,sw-3,-46,-sw+3,-46])();
    g.clip();g.fillStyle=t==='party'?shade(p.topCol,1.7):'rgba(255,255,255,.6)';
    for(let yy=-80,r=0;yy<-24;yy+=4.5,r++)for(let xx=-18+(r%2)*2.2;xx<=18;xx+=4.5)g.fillRect(xx-.75,yy,1.5,1.5);
    g.restore();
  }
  if(t==='shirt'||t==='party'){
    P(g,skin,PL(g,[-2.5,-81,2.5,-81,0,-76]));
    P(g,p.topDark,PL(g,[-5.5,-81,-.5,-78,-4,-74]));P(g,p.topDark,PL(g,[5.5,-81,.5,-78,4,-74]));
    g.fillStyle=p.topDark;for(let y=-73;y<-49;y+=6)g.fillRect(-.6,y,1.2,1.2);
  }
  if(t==='police'){
    P(g,'#121a2c',PL(g,[-1.3,-79,1.3,-79,1.8,-66,0,-64,-1.8,-66]));
    P(g,'#d4b045',PL(g,[-10,-74,-5,-74,-5,-69,-7.5,-67,-10,-69]));
    P(g,'#0c0c10',RR(g,-13,-51,26,4,1));P(g,'#b8b8b8',RR(g,-2,-51,4,4,.5));
  }
  if(t==='tee'||t==='longtee')P(g,skin,EL(g,0,-80,4.5,2.6));
  if(t==='longtee')P(g,shade(p.topCol,1.5),RR(g,-6,-70,12,9,2)); // 가슴 프린트
  if(t==='jacket'){
    P(g,p.inner,PL(g,[-4.5,-80,4.5,-80,3.5,-46,-3.5,-46]));
    P(g,p.topDark,PL(g,[-4.5,-80,-1,-64,-8,-73]));P(g,p.topDark,PL(g,[4.5,-80,1,-64,8,-73]));
  }
  if(t==='track'){P(g,p.stripe,RR(g,-.5,-80,1,34,0));P(g,p.topDark,EL(g,0,-80,6,2.5))}
  if(p.gun){ // 허리춤 권총집과 은색 손잡이
    const hx=d>0?6.5:-12.5;
    P(g,'#4a2c18',RR(g,hx,-51,6,13,1.5));
    P(g,'#d0d0d8',RR(g,hx+1,-57.5,4,7.5,1));
    P(g,'#8a8a92',RR(g,hx+1.5,-52,3,1,0));
  }
  // 머리 (후드티는 머리 뒤로 모자가 보임)
  if(t==='hoodie')P(g,p.topDark,EL(g,d*.3,-90.5,10.5,11.5));
  P(g,skin,EL(g,d*.5,-92,7.5,9));
  const e=Math.max(1.3,PXU);
  g.fillStyle='#1a1214';g.fillRect(d*1.8-3.6,-93,e,e);g.fillRect(d*1.8+2.4,-93,e,e);
  g.fillStyle='rgba(90,40,40,.8)';g.fillRect(d*1.8-1.6,-86.5,3.2,Math.max(.7,PXU));
  if(p.old){ // 나이 든 얼굴: 이마·눈가 주름
    g.strokeStyle='rgba(70,35,30,.75)';g.lineWidth=Math.max(.6,PXU);g.beginPath();
    g.moveTo(d*.5-4,-97.2);g.lineTo(d*.5+4,-97.2);g.moveTo(d*.5-3,-95.6);g.lineTo(d*.5+3,-95.6);
    g.moveTo(d*1.8-5.5,-91);g.lineTo(d*1.8-4,-90);g.moveTo(d*1.8+5.5,-91);g.lineTo(d*1.8+4,-90);g.stroke();
  }
  if(p.mustache)P(g,p.hairCol,PL(g,[d*1.8-3.6,-88,d*1.8+3.6,-88,d*1.8+3,-86.6,d*1.8-3,-86.6]));
  if(p.scar){ // 눈가를 가로지르는 흉터
    const sx=d*1.8+(d>0?2.2:-4.6);
    g.strokeStyle='#ffc4c4';g.lineWidth=Math.max(1.1,PXU*1.3);g.beginPath();g.moveTo(sx-1.2,-98);g.lineTo(sx+2.8,-87.5);g.stroke();
    g.lineWidth=Math.max(.7,PXU);g.beginPath();for(let k=0;k<3;k++){const yy=-96+k*3.2,xx=sx-.6+k*1.25;g.moveTo(xx-1.5,yy);g.lineTo(xx+1.5,yy)}g.stroke();
  }
  if(p.shades)P(g,'#050505',RR(g,d*1.8-6,-94.5,12,3,1));
  if(p.cigar)P(g,'#6a4424',RR(g,d>0?d*1.8+1:d*1.8-8,-87.4,7,1.8,.6));
  const h=p.hair,hc=p.hairCol;
  if(h==='blond'){
    P(g,hc,PL(g,[-9,-92,-9.5,-99,-5,-104,2,-104.5,8,-101,9.5,-95,8,-90,6,-95,3,-91.5,1,-96,-2.5,-91,-4,-96,-7,-90]));
    g.strokeStyle='rgba(255,236,170,.7)';g.lineWidth=Math.max(.6,PXU);g.beginPath();g.moveTo(-4,-102);g.lineTo(2,-97);g.moveTo(1,-103);g.lineTo(6,-97);g.stroke();
  }
  if(h==='short')P(g,hc,PL(g,[-8.2,-91,-8.5,-98,-4,-102.5,4,-102.5,8.5,-98,8.2,-91,6.5,-96,-6.5,-96]));
  if(h==='slick')P(g,hc,PL(g,[-8.2,-92,-8.5,-98,-3,-102.5,5,-102,8.5,-97,8.2,-92,7,-97.5,-6.5,-97]));
  if(h==='long')P(g,hc,PL(g,[-9.5,-84,-9.5,-98,-4,-103,4,-103,9.5,-98,9.5,-84,7.5,-95,1,-98,-7.5,-93]));
  if(h==='bun'){P(g,hc,PL(g,[-8.4,-90,-8.6,-98,-4,-102.5,4,-102.5,8.6,-98,8.4,-90,7,-96,-7,-96]));P(g,hc,EL(g,-d*4,-103,4.2,3.8))}
  if(h==='bald'){P(g,'rgba(255,255,255,.16)',EL(g,-2,-98,3.4,1.8));
    if(p.old){P(g,hc,RR(g,-8.4,-96,2.4,7,1));P(g,hc,RR(g,6,-96,2.4,7,1))}} // 회색 옆머리
  if(p.hat==='beanie'){P(g,p.hatCol,PL(g,[-8.6,-95,-8,-101,-3,-105,3,-105,8,-101,8.6,-95]));P(g,shade(p.hatCol,.7),RR(g,-8.8,-97.5,17.6,3,1))}
  if(p.hat==='bcap'){P(g,p.hatCol,PL(g,[-8.4,-96,-8,-101,-3,-104.5,3,-104.5,8,-101,8.4,-96]));P(g,p.hatCol,EL(g,d*7,-96.5,7,1.6))}
  if(p.hat==='cap'){P(g,'#1d2a48',PL(g,[-8.5,-98,8.5,-98,10.5,-106,-10.5,-106]));P(g,'#0a0a0e',EL(g,d*5,-97.8,8.5,1.8));P(g,'#d4b045',EL(g,0,-102,1.8,1.8))}
}

// ================= 괴물 (발 = 원점, 키 약 180) =================
function chain(g,col,q,r0,r1,seed){const R=rng(seed);g.fillStyle=col;g.beginPath();
  for(let i=0;i<=24;i++){const t=i/24,a=(1-t)*(1-t),b=2*t*(1-t),c=t*t,x=a*q[0]+b*q[2]+c*q[4],y=a*q[1]+b*q[3]+c*q[5],r=(r0+(r1-r0)*t)*(.85+R()*.3);g.moveTo(x+r,y);g.arc(x,y,r,0,Math.PI*2)}
  g.fill()}
function monster(g){
  const B='#8a5a2c';
  chain(g,B,[-20,-75,-27,-40,-24,-8],17,13,1);chain(g,B,[20,-75,27,-40,24,-8],17,13,2);
  P(g,B,EL(g,-28,-6,18,7));P(g,B,EL(g,28,-6,18,7));
  P(g,B,EL(g,0,-112,50,48));P(g,B,EL(g,0,-80,38,22));
  P(g,B,EL(g,-42,-142,26,20));P(g,B,EL(g,42,-142,26,20));
  chain(g,B,[-52,-140,-84,-95,-66,-38],21,15,3);chain(g,B,[52,-140,84,-95,66,-38],21,15,4);
  for(const s of[-1,1]){P(g,B,EL(g,s*66,-34,15,13));
    for(let i=0;i<4;i++){const fx=s*(56+i*6);chain(g,B,[fx,-30,fx+s*2,-20,fx+s,-10],4.4,3,10+i)}}
  P(g,B,EL(g,0,-154,30,16));P(g,B,EL(g,4,-166,20,16));
  const R=rng(11);g.save();g.globalCompositeOperation='source-atop';
  for(let i=0;i<80;i++){const x=(R()-.5)*180,y=-R()*180,r=4+R()*12;g.fillStyle=x>-10?'rgba(55,32,12,.55)':'rgba(70,42,18,.3)';g.beginPath();g.ellipse(x,y,r*1.5,r*.6,R()*3,0,Math.PI*2);g.fill()}
  for(let i=0;i<28;i++){const x=-85+R()*85,y=-R()*175,r=3+R()*8;g.fillStyle='rgba(210,155,95,.35)';g.beginPath();g.ellipse(x,y,r*1.4,r*.55,R()*3,0,Math.PI*2);g.fill()}
  g.strokeStyle='rgba(40,22,8,.85)';g.lineWidth=Math.max(.9,PXU);
  for(let i=0;i<26;i++){let x=(R()-.5)*150,y=-20-R()*150;g.beginPath();g.moveTo(x,y);for(let k=0;k<4;k++){x+=(R()-.5)*12+6;y+=(R()-.5)*7;g.lineTo(x,y)}g.stroke()}
  g.restore();
}
function monFace(g){
  g.shadowColor='#ffb300';g.shadowBlur=16;g.fillStyle='#ffe27a';
  for(const p of[[-9,-171,2,-166,-1,-162.5,-10,-166],[7,-166,19,-171,18,-166,9,-162.5]]){g.beginPath();PL(g,p)();g.fill()}
  g.shadowBlur=0;
  g.fillStyle='#140903';g.beginPath();g.ellipse(5,-152,16,8,0,0,Math.PI*2);g.fill();
  g.fillStyle='#eedfa6';
  for(let x=-9;x<=17;x+=4.3){g.beginPath();g.moveTo(x,-159);g.lineTo(x+3.4,-159);g.lineTo(x+1.7,-152.5);g.fill()}
  for(let x=-7;x<=15;x+=4.6){g.beginPath();g.moveTo(x,-144.5);g.lineTo(x+3.4,-144.5);g.lineTo(x+1.7,-150);g.fill()}
}

// ================= 실루엣 스프라이트 =================
function maskOf(src,col){const m=mk(src.width,src.height),x=m.getContext('2d');x.drawImage(src,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,m.width,m.height);return m}
// glow: 어둡게 덮은 뒤에 그리는 부분 (괴물 눈·이빨)
function sprite(draw,wU,hU,u,glow){
  const pad=4,c=mk(wU*u+pad*2,hU*u+pad*2),g=c.getContext('2d');
  const T=()=>g.setTransform(u,0,0,u,c.width/2,c.height-pad);
  T();PXU=1/u;draw(g);g.setTransform(1,0,0,1,0,0);
  g.globalCompositeOperation='source-atop';g.fillStyle=`rgba(7,6,12,${CFG.darken})`;g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='source-over';
  if(glow){T();glow(g);g.setTransform(1,0,0,1,0,0)}
  const o=mk(c.width,c.height),x=o.getContext('2d');
  x.drawImage(maskOf(c,'#ff2a3d'),3,0);x.drawImage(maskOf(c,'rgba(150,180,255,.6)'),-2,-1);x.drawImage(c,0,0);
  o.foot=pad;return o;
}
const FR=new Map();
function frames(spec,face,u=U){
  const key=spec.id+'|'+face+'|'+u;let f=FR.get(key);if(f)return f;
  const s=Object.assign({},spec,{face});f=[];
  for(let i=0;i<8;i++)f.push(sprite(g=>person(g,s,i/8),66,114,u));
  FR.set(key,f);return f;
}
function portrait(spec){
  const key='por|'+spec.id;let p=FR.get(key);if(p)return p;
  p=sprite(g=>person(g,Object.assign({},spec,{face:1}),0),66,114,1.6);FR.set(key,p);return p;
}
let MON=null;
const monSprite=()=>MON||(MON=sprite(monster,200,192,1.75,monFace));
// 2스테이지 끝에서는 괴물을 검게 흐린 실루엣으로만 보여줌 (3스테이지에서 처음 공개)
let MONB=null;
function monBlur(){
  if(MONB)return MONB;
  const m=monSprite(),pad=30,c=mk(m.width+pad*2,m.height+pad*2),g=c.getContext('2d');
  g.filter='blur(12px)';g.globalAlpha=.45;g.drawImage(maskOf(m,'#ff2a3d'),pad+5,pad);

const CAS={tee:['#8a8a8a','#a83a2a','#2a5a6a','#e4e4e4'],hoodie:['#4a4a50','#2f4a2f','#6a1a1a','#1a1a1a','#2a3a6a'],
  longtee:['#3a3a40','#5a2a4a','#2a4a4a','#7a2a2a'],track:['#1a3a6a','#6a1a1a','#1a1a1a','#2a5a3a']};

const SLACKS=['#2a2a30','#3a3428','#1e2430','#5a5a60','#4a3a30'];
const pickR=R=>a=>a[Math.floor(R()*a.length)];

// 1스테이지: 정장(남)·드레스(여)가 정답(valid), 나머지는 평상복(decoy). 정장은 넥타이 없음
function genS1(kind,R){
  const pick=pickR(R),f=R()<.5;
  const s={sex:f?'f':'m',skin:pick(SKINS),hairCol:pick(HAIRC)};
  if(kind==='valid'){
    if(f){s.top='dress';s.topCol=pick(DRESS);s.hair=pick(['long','bun']);s.shoe=pick(['#111111','#6a0d1d','#c9a25a'])}
    else{s.top='suit';s.topCol=pick(SUITS);s.topDark=shade(s.topCol,.62);s.pants=s.topCol;s.shoe='#0b0b0b';s.hair=pick(['short','slick','bald'])}
  }else{
    const t=pick(['tee','hoodie','longtee','track']);s.top=t;s.topCol=pick(CAS[t]);s.topDark=shade(s.topCol,.65);
    s.pants=t==='track'?s.topCol:pick(JEANS);s.inner=pick(['#d8d8d8','#333333','#8a1a1a']);s.stripe='#d8d8d8';
    s.shoe=pick(['#d8d8d8','#222222','#5a4030']);s.hair=pick(f?['long','bun','short']:['short','bald','slick']);
    if(R()<.3){s.hat=pick(['beanie','bcap']);s.hatCol=pick(['#1a1a1a','#6a1a1a','#3a3a40','#2a3a5a'])}
  }
  return s;
}
// 2스테이지: staff(바텐더) · young/old(젊은·나이 든 마피아 부하, 검은 정장) · dress(드레스 손님) · decoy(셔츠 차림 손님)
// 나이 든 부하는 회색 머리(또는 회색 옆머리의 대머리)와 주름, 절반은 콧수염. 젊은 부하는 검은 머리이고 대머리가 없음
function genS2(kind,R){
  const pick=pickR(R);
  if(kind==='young'||kind==='old'){
    const old=kind==='old',s={sex:'m',mafia:true,old,skin:pick(SKINS),top:'suit',
      topCol:'#0b0b0d',topDark:'#040405',shirt:'#1c1c22',pants:'#0b0b0d',shoe:'#050505'};
    s.gun=R()<.6;s.scar=R()<.4;
    if(old){s.hairCol=pick(['#a8a8ac','#c8c8cc','#8a8a8e']);s.hair=pick(['slick','short','bald']);s.mustache=R()<.55}
    else{s.hairCol=pick(['#111111','#2a1d14','#3b2216']);s.hair=pick(['slick','short'])}
    return s;
  }
  if(kind==='dress')return {sex:'f',skin:pick(SKINS),hairCol:pick(HAIRC),top:'dress',topCol:pick(DRESS),hair:pick(['long','bun']),shoe:pick(['#111111','#6a0d1d','#c9a25a'])};
  if(kind==='party'){ // 파티 손님: 원색 무늬 반팔 셔츠 / 반짝이 원색 드레스 (검은 조끼 바텐더와 확실히 구분)
    const f=R()<.5,s={sex:f?'f':'m',party:true,skin:pick(SKINS),hairCol:pick(HAIRC),topCol:pick(['#e0306a','#20a8b0','#e09a20','#8a40d8','#30b060','#e05028'])};
    if(f){s.top='dress';s.sparkle=true;s.hair=pick(['long','bun']);s.shoe=pick(['#111111','#c9a25a','#d8d8d8'])}
    else{s.top='party';s.topDark=shade(s.topCol,.65);s.pants=pick(['#d8d4cc','#e8e0d0','#3a3a48']);s.shoe=pick(['#d8d8d8','#3a2418']);s.hair=pick(['short','slick'])}
    return s;
  }
  const f=R()<.5,s={sex:f?'f':'m',skin:pick(SKINS),hairCol:pick(HAIRC)};
  s.hair=pick(f?['long','bun','short']:['short','slick','bald']);
  if(kind==='staff'){s.staff=true;s.top='vest';s.topCol=pick(['#0e0e10','#1a0c10']);s.shirt='#e8e6e0';s.pants='#0e0e10';s.shoe='#0a0a0a';return s}
  s.top='shirt';s.topCol=pick(SHIRTS);s.topDark=shade(s.topCol,.7);s.pants=pick(SLACKS);s.shoe=pick(['#111111','#3a2418']);
  return s;
}
// 4스테이지: police(제복 경찰) · mafia · staff(바텐더) · guest(대피하는 손님: 셔츠·드레스)
function genS4(kind,R){
  const pick=pickR(R);
  if(kind==='police'){const f=R()<.3;
    return {sex:f?'f':'m',police:true,skin:pick(SKINS),hairCol:pick(['#111111','#2a1d14','#5a3a22']),hair:f?'bun':pick(['short','slick']),
      top:'police',topCol:'#2c3a5c',pants:'#1d2438',shoe:'#0b0b0b',hat:'cap'}}
  if(kind==='mafia')return genS2(R()<.5?'old':'young',R);
  if(kind==='staff')return genS2('staff',R);
  const s=genS2(R()<.35?'dress':'decoy',R);s.guest=true;return s;
}

// 구간마다 NPC를 2~4명 팀으로 나눠 배치하고, 각 NPC가 플레이어에게 닿는 시각(ta)과 검문 시점을 계산
// 판마다 NPC 번호를 새로 매김 (같은 번호를 쓰면 이전 판의 그림이 캐시에서 나와 고른 모습과 저장된 모습이 달라짐)
let GAME_NO=0;
function buildStage(st,R){
  GAME_NO++;for(const k of FR.keys())if(k.startsWith('n')||k.startsWith('por|n'))FR.delete(k);
  const list=[],sig=new Set(),checks=[];
  let idx=0,span=0;
  const segs=st.segs.map(seg=>{
    const kinds=[];for(const k in seg)for(let i=0;i<seg[k];i++)kinds.push(k);
    for(let i=kinds.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[kinds[i],kinds[j]]=[kinds[j],kinds[i]]}
    const sizes=[];let n=kinds.length;
    while(n>0){let k=2+Math.floor(R()*3);if(n<=4)k=n;else if(n-k===1)k=k<4?k+1:k-1;sizes.push(k);n-=k}
    const offs=[];let off=0;sizes.forEach(k=>{for(let j=0;j<k;j++){offs.push(off);off+=CFG.spacing}off+=CFG.teamGap-CFG.spacing});
    span+=offs[offs.length-1];
    return {kinds,offs};
  });
  const V=span/(+HP.get('pass')||st.pass);
  let start=CFG.lead+(W+60-PX)/V;
  segs.forEach((sg,k)=>{
    sg.kinds.forEach((kind,j)=>{
      let s,key;do{s=st.gen(kind,R);key=JSON.stringify(s)}while(sig.has(key));
      sig.add(key);s.id='n'+GAME_NO+'_'+idx;
      list.push({i:idx,spec:s,ta:start+sg.offs[j]/V,x:9999,saved:null});idx++});
    const J=start+sg.offs[sg.offs.length-1]/V+CFG.after; // 검문 시각 (NPC 시계)
    checks.push(Object.assign({},st.checks[k],{D:J-k*CFG.hold,ds:0,called:false})); // D: 전진 거리 시계 기준
    // 다음 구간: 기본은 첫 NPC가 segGap초 뒤 플레이어에게 닿음, phaseGap이 있으면 통과 후 그 시간 뒤에 화면에 나타남
    start=J+CFG.hold+(st.phaseGap!=null?st.phaseGap+(W+60-PX)/V:CFG.segGap);
  });
  return {list,checks,V};
}

    if(G.cool>0){toast('변신 쿨타임 '+G.cool.toFixed(1)+'초');sfx('deny');return}
    setLook(spec);G.cool=CFG.cool;
  }
}
// 클럽 내부 구간 비중: 댄스홀 → (바 입구) → 바 → (복도 입구) → 복도
function clubWeights(){
  const c0=G.checks[0],c1=G.checks[1];
  if(G.place==='escape'){ // 탈출은 거꾸로: 복도 → 바 → (바 출구) → 댄스홀
    const b=clamp((G.d-c0.D*.45)/1.5,0,1),d=clamp((G.d-c0.D-.4)/1.2,0,1);return {c:1-b,b:b-d,d}}
  const b=c0?clamp((G.d-c0.D-.4)/1.2,0,1):0,c=c1?clamp((G.d-c1.D-.4)/1.2,0,1):0;
  return {d:1-b,b:b-c,c};
}
function clubAudio(){
  if(G.place==='street')setClub(clamp(1-(keeperX(0)-PX)/900,0,1)*.35,260);
  else if(G.place==='escape')setClub(0,260); // 음악은 멈췄고 사이렌만
  else{const w=clubWeights();setClub(.55*w.d+.4*w.b+.14*w.c,1700*w.d+900*w.b+320*w.c)}
}
// 구간이 시작될 때 플레이어가 말풍선으로 필요한 모습을 알려 줌
function phaseTalk(k){const L=STG().phaseLines[k];G.sq=L?{t0:G.t,lines:L,i:0}:null}
function phaseTalkUpdate(){
  const q=G.sq;if(!q)return;
  if(q.i<q.lines.length&&G.t-q.t0>=.4+q.i*4.4){say(q.lines[q.i],()=>G.end?G.end.px:PX,4.2);G.bubble.player=true;q.i++}
  if(q.i>=q.lines.length)G.sq=null;
}
// 스테이지 시작 전 독백
function startIntro(){G.state='intro';G.dlg={i:0,t:0}}
function nextLine(){const D=G.dlg;D.i++;D.t=0;if(D.i>=STG().intro.length){G.state='play';G.dlg=null}}

function update(dt){
  G.clock+=dt;
  if(G.place==='street')rainUpdate(dt);
  if(G.toast&&(G.toast.t-=dt)<=0)G.toast=null;
  if(G.bubble&&(G.bubble.t-=dt)<=0)G.bubble=null;
  if(G.morph&&(G.morph.t+=dt)>=MORPH)G.morph=null;
  if(G.state==='title'){G.scroll+=60*dt;return}
  if(G.state==='intro'){G.scroll+=G.ground*dt;clubAudio();if((G.dlg.t+=dt)>3.1)nextLine();return}
  if(G.state==='stairs')return stairsUpdate(dt);
  if(G.state==='boss')return bossUpdate(dt);
  if(G.state==='end')return endUpdate(dt);
  if(G.state==='ending')return endingUpdate(dt);
  if(G.state!=='play')return;
  G.t+=dt;
  if(G.hold){ // 검문 통과: 잠시 멈췄다가 다시 걸어감
    const h=G.hold;h.t+=dt;G.checks[h.k].ds=ease(clamp((h.t-.5)/.6,0,1));
    if(h.t>=CFG.hold){G.hold=null;G.ck++;G.slots=[null,null,null,null];G.cool=0;if(STG().phaseLines)phaseTalk(G.ck)} // 구간이 바뀌면 저장 칸 초기화
  }else{G.d+=dt;G.scroll+=G.ground*dt}
  if(G.cool>0&&(G.cool-=dt)<=0){G.cool=0;if(G.slots.some(Boolean))sfx('ready')}
  for(const n of G.npcs){n.x=PX+G.V*(n.ta-G.t);if(n.flash)n.flash=Math.max(0,n.flash-dt)}
  const pre=G.npcs.find(n=>!n.ready);if(pre){frames(pre.spec,-1);pre.ready=true} // 다음 NPC 미리 그리기
  // 커서: 지나간 NPC는 다음 NPC로 자동 이동
  const sel=selectable();
  if(G.cur&&!sel.includes(G.cur))G.cur=sel.find(n=>n.x>G.cur.x)||sel[0]||null;
  if(!G.cur&&sel.length)G.cur=sel[0];
  // 검문하는 사람이 보이면 조건을 외침
  const c=G.checks[G.ck];
  if(c&&!c.called&&!STG().noCall&&keeperX(G.ck)<W+40&&!G.patrols.some(p=>p.started&&!p.judged)){c.called=true;const k=G.ck;say(c.call,()=>keeperX(k),3.6);sfx('call')} // 화면에 들어오자마자 외침
  // 진흙이 굳음: 일정 시간이 지나면 균열, 더 지나면 변장이 무너짐
  if(!STG().noHarden&&G.look!==PLAYER&&!G.morph){G.hard+=dt;
    if(G.hard>=CFG.harden&&!G.crackWarned){G.crackWarned=true;toast('얼굴이 굳기 시작한다 — 다시 빚어야 해');sfx('crack')}
    if(G.hard>=CFG.crumble){setLook(PLAYER);toast('변장이 무너졌다!');sfx('crumble')}}
  clubAudio();
  if(G.sq)phaseTalkUpdate();
  if(HP.has('bot'))bot(dt);
  if(G.patrols.length&&patrolUpdate())return;
  if(!G.hold&&c&&G.d>=c.D){G.d=c.D;judge()}
}
// 비: 빗줄기, 바닥에 튀는 물방울, 가끔 번개와 천둥
function rainUpdate(dt){
  for(const r of RAIN){r.y+=r.s*dt;r.x-=r.s*.25*dt;if(r.y>H){r.y=-20;r.x=Math.random()*(W+100)}if(r.x<-20)r.x+=W+40}
  for(let n=dt*70;n>0;n--)if(Math.random()<n)SPLASH.push({x:Math.random()*W,y:GY+4+Math.random()*(H-GY-10),t:0});
  for(const s of SPLASH)s.t+=dt;while(SPLASH.length&&SPLASH[0].t>.35)SPLASH.shift();
  LIGHT.v=Math.max(0,LIGHT.v-dt*2.5);
  if((LIGHT.next-=dt)<=0){LIGHT.v=1;LIGHT.next=7+Math.random()*7;sfx('thunder')}
  else if(LIGHT.v>.55&&LIGHT.v<.6&&Math.random()<.5)LIGHT.v=.9; // 두 번 번쩍
}
function drawRain(){
  ctx.strokeStyle='rgba(255,170,180,.24)';ctx.lineWidth=1.2;ctx.beginPath();
  for(const r of RAIN){ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-r.l*.25,r.y+r.l)}ctx.stroke();
  ctx.strokeStyle='rgba(220,200,210,.45)';ctx.lineWidth=1;
  for(const s of SPLASH){const k=s.t/.35;ctx.globalAlpha=1-k;ctx.beginPath();ctx.ellipse(s.x,s.y,2+k*9,1+k*2.5,0,Math.PI,Math.PI*2);ctx.stroke()}
  ctx.globalAlpha=1;
}
function judge(){
  const k=G.ck,c=G.checks[k],ok=c.check(G.look),at=()=>keeperX(k)+c.ds*60;
  if(ok&&!lastCheck()){G.hold={k,t:0};say(c.ok,at,1.4);sfx('pass');return}
  G.state='end';G.cur=null;
  G.end={ok,k,t:0,step:0,px:PX,alpha:1,fade:0,flash:0};
  if(ok)say(c.ok,at,1.4);
  else{G.overMsg=c.over;say(G.look===PLAYER?c.fail[0]:(c.failFor&&c.failFor(G.look))||(c.failYoung&&G.look.mafia?c.failYoung:c.fail[1]),at,1.8)}
}
// 돌발 순찰: 3초 전에 "거기, 멈춰!" 하며 달려와 플레이어 앞에서 검문, 마피아나 원래 모습이면 체포
const patrolX=p=>G.d<p.d?W+60-(W+60-(PX+110))*ease(clamp((G.d-(p.d-3))/3,0,1)):PX+110-(G.d-p.d)*320;
function patrolUpdate(){
  const p=G.patrols.find(p=>!p.done&&G.d>=p.d-3);if(!p)return false;
  if(!p.started){p.started=true;say(BAL.patrol.stop,()=>patrolX(p),2.2);sfx('call');sfx('siren')}
  if(!p.judged&&G.d>=p.d){p.judged=true;
    if(G.look===PLAYER||G.look.mafia){
      G.state='end';G.cur=null;G.overMsg='순찰에 걸렸다 — 체포';G.end={ok:false,k:G.ck,t:0,step:0,px:PX,alpha:1,fade:0,flash:0};
      say(G.look===PLAYER?BAL.patrol.caughtPlayer:BAL.patrol.caughtMafia,()=>patrolX(p),1.8);return true}
    say(BAL.patrol.ok,()=>patrolX(p),1.4);sfx('pass')}
  if(p.judged&&patrolX(p)<-120)p.done=true;
  return false;
}
function endUpdate(dt){
  const E=G.end;E.t+=dt;const t=E.t,stairs=G.place==='club',c=G.checks[E.k];
  if(E.ok){
    if(t>.6&&E.step===0){E.step=1;sfx('open')}
    c.ds=ease(clamp((t-.6)/.6,0,1));
    if(t>1.1)E.px=PX+ease(clamp((t-1.1)/1.6,0,1))*215;
    if(G.place==='escape'){ // 정문 밖으로 → 엔딩
      if(t>2.3)E.alpha=clamp(1-(t-2.3)/.6,0,1);
      if(t>2.6)E.fade=clamp((t-2.6)/.6,0,1);
      if(t>3.3&&E.step===1){E.step=2;startEnding()}
    }else if(stairs){
      // 계단 입구로 사라진 뒤 계단 연출로
      if(t>2.3)E.alpha=clamp(1-(t-2.3)/.6,0,1);
      if(t>2.6)E.fade=clamp((t-2.6)/.6,0,1);
      if(t>3.3&&E.step===1){E.step=2;startStairs()}
    }else{
      if(t>2.1&&E.step===1){E.step=2;setLook(PLAYER);G.slots=[null,null,null,null];G.cool=0}
      if(t>2.4)E.alpha=clamp(1-(t-2.4)/.6,0,1);
      if(t>2.8)E.fade=clamp((t-2.8)/.7,0,1);
      if(t>3.6&&E.step===2){E.step=3;G.state='clear';sfx('clear');bgmOn(false)}
    }
  }else{
    if(t>1.3&&E.step===0){E.step=1;sfx('push');E.flash=1}
    E.flash=Math.max(0,E.flash-dt*1.5);
    if(t>1.3)E.px=PX-ease(clamp((t-1.3)/.4,0,1))*70;
    if(t>1.9)E.fade=clamp((t-1.9)/.6,0,1)*.75;
    if(t>2.2&&E.step===1){E.step=2;G.state='over';sfx('fail');bgmOn(false)}
  }
}
// 계단: 자동으로 오르며 괴물로 변함 (2스테이지 끝)
function startStairs(){
  G.state='stairs';G.slots=[null,null,null,null];G.cool=0;G.morph=null;G.bubble=null;
  G.st={t:0,s:0,step:0,roar:false};monBlur();setClub(.08,220);
}
function stairsUpdate(dt){
  const S=G.st;S.t+=dt*1.1;dt*=1.1; // 진행 템포 10% 빠르게
  const climbing=S.t>.4&&S.t<6.9;
  if(climbing)S.s+=dt*1.75;
  if(climbing&&Math.floor(S.s)>S.step){S.step=Math.floor(S.s);sfx('step',clamp((S.t-.6)/5,0,1))}
  if(S.t>5.6&&!S.roar){S.roar=true;sfx('roar')}
  if(S.t>=STAIR_T){G.state='clear';sfx('clear');bgmOn(false)}
}
// 테스트용 자동 플레이 (#bot): 남은 검문에 필요한 모습을 모아 두었다가 검문 직전에 변신
function bot(dt){
  if((G.botT-=dt)>0)return;G.botT=.12;
  const rem=G.checks.slice(G.ck),need=rem[0].check,sel=selectable();
  const pat=STG().patrols,safe=s=>s&&s!==PLAYER&&!s.mafia; // 순찰에 걸리지 않는 모습
  const have=c=>G.slots.some(s=>s&&c.check(s));
  const wanted=s=>rem.some(c=>c.check(s)&&!have(c))||(pat&&safe(s)&&!G.slots.some(safe));
  if(G.cur&&!G.cur.saved&&G.slots.includes(null)&&wanted(G.cur.spec))return onKey('Space');
  const target=sel.find(n=>!n.saved&&wanted(n.spec));
  if(target&&G.cur&&target!==G.cur)return onKey(target.x>G.cur.x?'ArrowRight':'ArrowLeft');
  if(G.cool>0)return;
  const near=keeperX(G.ck)-PX<G.ground*7;
  if(pat){ // 순찰이 언제 올지 모르니 늘 안전한 모습을 유지하고, 굳으면 바로 다시 빚음
    if(!safe(G.look)||G.hard>=CFG.harden||(near&&!need(G.look))){
      let k=G.slots.findIndex(s=>s&&need(s));if(k<0)k=G.slots.findIndex(safe);if(k>=0)onKey('Key'+KEYS[k])}
    return;
  }
  if((near&&!need(G.look))||(G.hard>=CFG.harden&&need(G.look))){
    const k=G.slots.findIndex(s=>s&&need(s));if(k>=0)onKey('Key'+KEYS[k])}
}

// ================= 그리기 =================
// 스프라이트 모양 그대로의 진흙 덩어리 (변신 연출용)
function mudOf(spr){
  if(spr.mud)return spr.mud;
  const m=maskOf(spr,'#7a4c24'),g=m.getContext('2d'),R=rng(spr.width*7+spr.height);
  g.globalCompositeOperation='source-atop';
  for(let i=0;i<40;i++){g.fillStyle=R()<.6?'rgba(50,28,10,.45)':'rgba(170,120,70,.35)';
    g.beginPath();g.ellipse(R()*m.width,R()*m.height,4+R()*14,2+R()*5,R()*3,0,Math.PI*2);g.fill()}
  spr.mud=m;return m;
}
// o: y(발 높이), alpha(전체 투명도), base(원래 모습 투명도), mud(진흙 덮기 0~1), sx/sy(늘이기)
function drawChar(spr,x,o={}){
  const a=o.alpha??1,base=o.base??1,sx=o.sx||1,sy=o.sy||1,fy=o.y??GY;
  if(o.shadow!==false){ctx.fillStyle=`rgba(0,0,0,${.55*a})`;ctx.beginPath();ctx.ellipse(x,fy,spr.width*.3*sx,5,0,0,Math.PI*2);ctx.fill()}
  const w=spr.width*sx,h=spr.height*sy,dx=Math.round(x-w/2),dy=Math.round(fy-h+spr.foot*sy);
  if(base>0){ctx.globalAlpha=a*base;ctx.drawImage(spr,dx,dy,w,h)}
  if(o.mud>0){ctx.globalAlpha=a*Math.min(1,o.mud);ctx.drawImage(mudOf(spr),dx,dy,w,h)}
  if(o.mudTop>0){ // 머리부터 아래로 번지는 진흙 (mudTop = 덮인 비율)
    ctx.save();ctx.beginPath();ctx.rect(dx,dy,w,h*o.mudTop);ctx.clip();ctx.globalAlpha=a;ctx.drawImage(mudOf(spr),dx,dy,w,h);ctx.restore()}
  ctx.globalAlpha=1;
}
// 타이틀: 주인공이 얼굴부터 진흙에 덮여 검은 괴물 형체가 됐다가 다시 사람으로 돌아오기를 반복
function drawTitleHero(){
  const T=8.6,t=G.clock%T,x=190,me=frames(PLAYER,1)[Math.floor(((G.clock*1.4)%1)*8)],mon=monBlur();
  const top=GY-me.height+me.foot;
  if(t<1.8||t>=7.6)drawChar(me,x);
  else if(t<3.4){const m=(t-1.8)/1.6;drawChar(me,x,{mudTop:.18+.82*ease(m)}); // 얼굴부터
    if(m>.1)mudDrops(x,top+(me.height-me.foot)*(.18+.82*m)+40,m,8,60,40)}
  else if(t<4.6){const m=ease((t-3.4)/1.2),p=Math.sin(t*9)*.03;
    drawChar(me,x,{base:0,mud:1,alpha:1-m,sx:1+.4*m+p,sy:1+.12*m-p});drawChar(mon,x,{alpha:m,sx:.7+.3*m,sy:.7+.3*m,shadow:false})}
  else if(t<6.4){const br=1+Math.sin(G.clock*2.4)*.015;drawChar(mon,x,{sx:br,sy:1/br,shadow:false})}
  else{const m=ease((t-6.4)/1.2);drawChar(mon,x,{alpha:1-m,sx:1-.3*m,sy:1-.3*m,shadow:false});drawChar(me,x,{mud:1-m,alpha:m})}
}
function tile(img,f,alpha=1){if(alpha<=0)return;ctx.globalAlpha=alpha;const x=-((G.scroll*f)%1920);ctx.drawImage(img,x,0);ctx.drawImage(img,x+1920,0);ctx.globalAlpha=1}
function drawClubBG(){
  const w=clubWeights();
  tile(BG.dance,.6,1);tile(BG.bar,.6,w.b+w.c);tile(BG.corr,.6,w.c);
  if(G.place==='escape'){ // 경찰 경광등: 붉은빛·푸른빛이 번갈아 훑고 지나감
    ctx.save();ctx.globalCompositeOperation='lighter';
    const red=Math.floor(G.clock*2.6)%2===0,sx=(G.clock*420)%(W+600)-300;
    ctx.fillStyle=red?'rgba(255,30,40,.10)':'rgba(40,90,255,.13)';ctx.fillRect(0,0,W,H);
    const g=ctx.createRadialGradient(sx,120,10,sx,120,300);g.addColorStop(0,red?'rgba(255,40,50,.28)':'rgba(60,110,255,.32)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();
  }else if(w.d>0){ // 댄스홀 조명

    const cols=['255,40,140','200,40,255','255,40,60','120,60,255','255,60,180'];
    for(let i=0;i<5;i++){const bx=100+i*190,an=Math.sin(G.clock*.7+i*1.7)*.55;
      ctx.save();ctx.translate(bx,0);ctx.rotate(an);
      const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,`rgba(${cols[i]},${.22*w.d})`);g.addColorStop(1,`rgba(${cols[i]},0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(6,0);ctx.lineTo(70,GY+40);ctx.lineTo(-70,GY+40);ctx.closePath();ctx.fill();ctx.restore()}
    if((G.clock%2.3)<.07){ctx.fillStyle=`rgba(255,255,255,${.12*w.d})`;ctx.fillRect(0,0,W,H)}
    ctx.restore();
  }
}
function drawWorld(){
  const street=G.place==='street';
  if(street){const gr=ctx.createLinearGradient(0,0,0,GY);gr.addColorStop(0,'#0a0810');gr.addColorStop(1,'#3a0c16');
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);tile(BG.far,.15);tile(BG.mid,.45)}
  else drawClubBG();
  const playing=G.state==='play'||G.state==='end';
  // 검문 입구들
  const ks=playing?G.checks.map((c,k)=>keeperX(k)):[];
  ks.forEach((kx,k)=>{const img=BG[G.checks[k].gate],door=kx+95;if(door-img.cx<W&&door-img.cx+img.width>0)ctx.drawImage(img,Math.round(door-img.cx),0)});
  // 바닥
  const w=street?null:clubWeights();
  ctx.fillStyle=street?'#0d0508':w.c>.5?'#090406':w.b>.5?'#0e0705':'#0c0610';ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle='#2a0f16';ctx.fillRect(0,GY,W,2);
  ctx.fillStyle='#16080d';for(let x=-((G.scroll)%120);x<W;x+=120)ctx.fillRect(x,GY+2,2,H-GY);
  // 입구 불빛
  ks.forEach((kx,k)=>{const c=G.checks[k],door=kx+95;if(door<-400||door>W+400)return;
    const open=c.ds,col=GATE_GLOW[c.gate],kk=street?1:.55;
    const lg=ctx.createRadialGradient(door,GY,10,door,GY,380+open*200);lg.addColorStop(0,`rgba(${col},${(.42+open*.3)*kk})`);lg.addColorStop(1,`rgba(${col},0)`);
    ctx.fillStyle=lg;ctx.fillRect(door-600,0,1200,H);
    const rg=ctx.createLinearGradient(0,GY,0,H);rg.addColorStop(0,`rgba(${col},${.3*kk})`);rg.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=rg;ctx.fillRect(door-40,GY,80,H-GY)});
  if(!playing){if(G.state==='title')drawTitleHero();else drawPlayer(PX,G.clock*1.4);return}
  // 검문하는 사람 (통과시키면 뒤로 비켜섬)
  ks.forEach((kx,k)=>{if(kx<-120||kx>W+120)return;const c=G.checks[k],ds=c.ds,kfr=frames(c.keeper,-1,2.85)[0];
    if(ds>0){ctx.save();ctx.translate(kx+ds*60,GY-ds*14);ctx.scale(1-ds*.12,1-ds*.12);ctx.translate(-(kx+ds*60),-GY);drawChar(kfr,kx+ds*60);ctx.restore()}
    else drawChar(kfr,kx)});

function drawPlayer(x,phase,alpha=1){
  const fi=Math.floor(((phase%1)+1)%1*8);
  const M=G.morph;
  if(M){
    // 원래 모습 → 진흙으로 뒤덮임 → 진흙 덩어리가 꿀렁이며 새 모습으로 → 진흙이 걷히며 새 모습
    const k=M.t/MORPH,from=frames(M.from,1)[fi],to=frames(M.to,1)[fi];
    if(k<.3){const m=k/.3;drawChar(from,x,{alpha,mud:m,sy:1-.04*m})}
    else if(k<.7){const m=(k-.3)/.4,wb=Math.sin(m*Math.PI*3)*.06;
      drawChar(from,x,{alpha,base:0,mud:Math.min(1,2-2*m),sx:1+wb,sy:.96-wb});
      drawChar(to,x,{alpha,base:0,mud:Math.min(1,2*m),sx:1-wb,sy:.96+wb,shadow:false})}
    else{const m=(k-.7)/.3;drawChar(to,x,{alpha,mud:1-m,sy:.96+.04*m})}
    if(k>.1&&k<.9)mudDrops(x,GY,k);
    return;
  }
  const spr=frames(G.look,1)[fi];
  const ck=G.look===PLAYER?0:clamp((G.hard-CFG.harden)/(CFG.crumble-CFG.harden),0,1);
  if(ck<=0)return drawChar(spr,x,{alpha});
  // 굳어 가는 얼굴: 진흙빛이 번지고 균열이 늘어나며 떨림
  const jx=ck>.7?(Math.random()-.5)*ck*4:0;
  drawChar(spr,x+jx,{alpha,mud:ck*.5});
  const fy=GY,n=Math.ceil(ck*CRACKS.length);
  ctx.save();ctx.translate(x+jx,fy);ctx.lineCap='round';
  for(let i=0;i<n;i++){const p=CRACKS[i];ctx.strokeStyle='rgba(30,14,4,.95)';ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(const q of p)ctx.lineTo(q[0],q[1]);ctx.stroke();
    ctx.strokeStyle='rgba(200,140,80,.6)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p[0][0]+1.5,p[0][1]);for(const q of p)ctx.lineTo(q[0]+1.5,q[1]);ctx.stroke()}
  ctx.restore();
}

function drawStairs(){

  let shake=0;if(t>5.6&&t<6.6)shake=(1-(t-5.6))*7;
  ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.fillStyle='#070205';ctx.fillRect(-10,-10,W+20,H+20);
  for(let i=-4;i<10;i++){const x=((i*200-s*SW*.5)%2000+2000)%2000-200,y=(s*SH*.5)%300;ctx.fillStyle='#0c0408';ctx.fillRect(x,-50+y-300,26,H+700)}

  ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
  const stepX=i=>SX-SW/2+(i-s)*SW,stepY=i=>SY-(Math.min(i,TOP)-s)*SH;
  for(let i=-16;i<TOP+16;i++){const x=stepX(i),y=stepY(i);if(x>W||x+SW<0)continue;
    ctx.fillStyle=i>TOP?'#12060a':'#160709';ctx.fillRect(x,y,SW+1,H-y+20);
    ctx.fillStyle='#5a1018';ctx.fillRect(x,y,SW+1,2)}
  ctx.strokeStyle='#1e080d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(stepX(-16)+SW/2,stepY(-16)-80);ctx.lineTo(stepX(TOP)+SW/2,stepY(TOP)-80);ctx.lineTo(stepX(TOP+16),stepY(TOP)-80);ctx.stroke();
  ctx.lineWidth=2;for(let i=-16;i<=TOP;i+=2){const x=stepX(i)+SW/2;ctx.beginPath();ctx.moveTo(x,stepY(i));ctx.lineTo(x,stepY(i)-80);ctx.stroke()}
  const dx=stepX(TOP+5),dy=stepY(TOP);
  if(dx<W+100){const dg=ctx.createRadialGradient(dx+40,dy-100,5,dx+40,dy-100,220);dg.addColorStop(0,'rgba(255,60,50,.5)');dg.addColorStop(1,'rgba(255,60,50,0)');
    ctx.fillStyle=dg;ctx.fillRect(dx-200,dy-330,480,340);ctx.fillStyle='#030102';ctx.fillRect(dx,dy-210,84,210);ctx.fillStyle='#ff4a50';ctx.fillRect(dx+70,dy-110,6,6)}
  const fi=Math.floor(((s/2)%1)*8),me=frames(G.look,1)[fi],mon=monBlur(),bob=-Math.abs(Math.sin(s*Math.PI))*4;
  const fy=SY+bob,x=SX;
  if(t<2.2){const m=clamp((t-.6)/1.6,0,1);drawChar(me,x,{y:fy,mud:m*.55})}
  else if(t<3.8){const m=ease((t-2.2)/1.6),c=clamp((t-2.2)/.4,0,1),pulse=Math.sin(t*9)*.03;
    drawChar(me,x,{y:fy,base:1-c,mud:.55+.45*c,sx:1+.4*m+pulse,sy:1+.12*m-pulse})}
  else{ // 진흙 덩어리가 검은 그림자 속으로 사라지며 거대한 형체만 남음
    const m=clamp((t-3.8)/1.4,0,1),sc=.72+.28*ease(m),br=1+Math.sin(t*2.4)*.015;
    if(m<1)drawChar(me,x,{y:fy,base:0,mud:1,alpha:1-m,sx:1.4,sy:1.12});
    drawChar(mon,x,{y:fy,alpha:Math.min(1,m*1.5),sx:sc*br,sy:sc/br,shadow:false})}
  if(t>.8&&t<5.4)mudDrops(x,fy,((t-.8)%1.2)/1.2+.1,10+Math.floor(t*4),60+t*14,240+t*10);
  ctx.restore();
  ctx.drawImage(BG.vig,0,0);
  const fade=Math.max(1-t/.6,clamp((t-6.9)/.8,0,1));

}

function bossInit(){return {ph:'calm',t:0,done:new Set(),monX:DOOR_X,monA:0,door:0,
  guards:[{spec:BG1,x:70,face:1,aim:false,fly:null},{spec:BG2,x:250,face:-1,aim:false,fly:null}],
  gi:0,qkey:null,qt:0,qmax:1.5,qwait:.5,mash:0,mt:3,shots:[],hits:[],splinters:[],flick:0,shake:0,swing:null,
  mx:M_X,lx:L_X,scale:1,eaten:[false,false],bite:null,bulge:0,melt:0,sirenOn:false,sub:null}}
const BITE_X=520; // 삼킬 때 괴물이 서는 자리 (책상 앞)
// 한입에 삼키기: k 0~.35 입을 벌림, .2~.6 사람을 입으로 들어 올림, .6 꿀꺽, 이후 입을 다물고 몸이 커짐
function biteState(){
  const B=G.B,b=B.bite;if(!b)return null;
  const k=b.t/2,open=k<.6?clamp(k/.35,0,1):clamp(1-(k-.6)/.15,0,1),e=ease(clamp((k-.2)/.4,0,1));
  return {i:b.i,k,open,e};
}
function go(ph){const B=G.B;B.ph=ph;B.t=0;B.done=new Set()}
function once(k,at){const B=G.B;if(B.t>=at&&!B.done.has(k)){B.done.add(k);return true}return false}
function bsay(text,at,dur,mon){say(text,at,dur);G.bubble.mon=!!mon;if(mon)sfx('growl')}
function shootOnce(g){
  const B=G.B;if(g.fly)return;
  B.shots.push({x:g.x+g.face*150,y:GY-193,t:0});
  B.hits.push({x:B.monX+(Math.random()-.5)*150,y:GY-90-Math.random()*190,t:0});
  sfx('shot');sfx('hit');
}
function bossUpdate(dt){
  const B=G.B;B.t+=dt*(B.ph==='qte1'||B.ph==='qte2'?1:1.1);const t=B.t; // 조작 구간 외에는 10% 빠르게
  B.shake=Math.max(0,B.shake-dt*12);B.flick=Math.max(0,B.flick-dt);
  for(const a of[B.hits,B.shots,B.splinters])for(const h of a)h.t+=dt;
  B.hits=B.hits.filter(h=>h.t<.7);B.shots=B.shots.filter(s=>s.t<.07);B.splinters=B.splinters.filter(s=>s.t<1.6);
  for(const g of B.guards)if(g.fly)g.fly.t+=dt;
  if(B.swing&&(B.swing.t+=dt)>.5)B.swing=null;
  if(B.ph==='calm'){
    if(once('a',.8))bsay(BAL.boss.calm,()=>B.mx,2.4);
    if(once('b',3.3))bsay(BAL.boss.laugh,()=>B.lx,1.2);
    if(t>4.6)go('knock');
  }else if(B.ph==='knock'){ // 쿵, 쿵, 쿵
    for(const k of[.2,1.1,2])if(once('k'+k,k)){sfx('thud');B.shake=7}
    if(once('g',1.4))bsay(BAL.boss.who,()=>B.guards[1].x,1.2);
    if(t>2.9)go('burst');
  }else if(B.ph==='burst'){ // 문이 부서지고 괴물이 처음으로 모습을 드러냄
    if(once('b',0)){sfx('doorBreak');B.door=1;B.shake=12;B.flick=1.6;
      for(let i=0;i<18;i++)B.splinters.push({x:DOOR_X+(Math.random()-.5)*60,y:GY-60-Math.random()*160,vx:80+Math.random()*260,vy:-120-Math.random()*200,r:Math.random()*6,t:0})}
    B.monA=clamp((t-.3)/.9,0,1);
    if(once('r',1.5)){sfx('roar');B.shake=9}
    if(t>2.6)B.monX=DOOR_X+(MON_X-DOOR_X)*ease(clamp((t-2.6)/1.6,0,1));
    if(once('turn',2.8))B.guards[1].face=1;
    if(t>4.4)go('shoot');
  }else if(B.ph==='shoot'){ // 총알은 진흙에 박힐 뿐
    if(once('a',0)){bsay(BAL.boss.what,()=>B.guards[1].x,1.4);B.guards.forEach(g=>g.aim=true)}
    if(t>.7&&t<2.6)B.guards.forEach(g=>{if(Math.random()<dt*5)shootOnce(g)});
    if(t>2.8)go('qte1');
  }else if(B.ph==='qte1'){ // 화면에 뜬 키를 눌러 경호원을 한 명씩 쳐냄
    const g=B.guards[B.gi];
    if(!g)return go('talk');
    if(g.fly){if(g.fly.t>1){B.gi++;B.qwait=.5}}
    else if(B.qkey){B.qt-=dt;if(Math.random()<dt*2)shootOnce(g);
      if(B.qt<=0){B.qkey=null;B.qwait=.8;shootOnce(g);B.flick=.12}}
    else{B.qwait-=dt;if(Math.random()<dt*3)shootOnce(g);if(B.qwait<=0){B.qkey=KEYS[Math.floor(Math.random()*4)];B.qt=B.qmax}}
  }else if(B.ph==='talk'){
    // 맷 헤이건: 마르코스가 얼굴을 망가뜨렸고, 그 얼굴을 고치려던 약물의 부작용으로 괴물이 됨
    const T=BAL.boss.talk,L=[[.3,T[0],0,2.2],[2.8,T[1],1,2.8],[6,T[2],0,2.4],[8.7,T[3],1,2.8]].filter(l=>l[1]);
    L.forEach(([at,txt,mon,d],i)=>{if(once('l'+i,at))bsay(txt,mon?()=>B.monX:()=>B.mx,d,mon)});
    B.mx=M_X+ease(clamp(t/3,0,1))*28;
    if(t>12)go('qte2');
  }else if(B.ph==='qte2'){ // Space 연타로 덩치를 키움
    if(once('a',0)){B.mash=0;B.mt=3}
    if(B.mash>=1)return go('swallow');
    B.mt-=dt;B.mash=Math.max(0,B.mash-dt*.05);
    B.scale+=(1+.25*B.mash-B.scale)*Math.min(1,dt*8);
    if(B.mt<=0){B.mash*=.4;B.mt=3;bsay(BAL.boss.plead,()=>B.mx,1.2);sfx('deny')}
  }else if(B.ph==='swallow'){ // 다가가서 한 명씩 한입에
    if(once('w',0)){G.bubble=null;sfx('growl')}
    if(t<.8)B.monX=MON_X+(BITE_X-MON_X)*ease(t/.8);
    for(const [i,at] of[[0,.8],[1,3]]){
      if(once('b'+i,at))B.bite={i,t:0}; // 먹힐 때 소리는 사용자가 따로 구할 예정
    }
    if(B.bite){B.bite.t+=dt*1.1;const s=biteState();
      if(s.k>=.6&&!B.eaten[s.i]){B.eaten[s.i]=true;B.shake=8;B.bulge=1;B.grow=(B.grow||0)+.12}
      if(s.k>=1)B.bite=null}
    if(B.grow>0){const g=Math.min(B.grow,dt*.3);B.scale+=g;B.grow-=g}
    B.bulge=Math.max(0,B.bulge-dt*.9);
    if(t>5.8)go('after');
  }else if(B.ph==='after'){ // 사이렌, 원래 모습으로
    if(once('s',1)){sfx('siren');B.sirenOn=true}
    if(once('m',2.2))sfx('morph');
    B.melt=clamp((t-2.2)/2.4,0,1);
    if(once('sub',4.9))B.sub=BAL.boss.after;
    if(t>8){G.state='clear';sfx('clear');bgmOn(false)}
  }
  if(HP.has('bot'))bossBot(dt);
}
function bossKey(code){
  const B=G.B;
  if(B.ph==='qte1'&&B.qkey){
    if(code==='Key'+B.qkey){const g=B.guards[B.gi];B.qkey=null;g.fly={t:0};g.aim=false;B.swing={t:0};sfx('swat');B.shake=8}
    else if(['KeyA','KeyS','KeyD','KeyF'].includes(code)){B.qt=Math.max(.01,B.qt-.5);sfx('deny')}
  }
  if(B.ph==='qte2'&&code==='Space'&&B.done.has('a')){B.mash=Math.min(1,B.mash+1/14);sfx('mash')}
}
// 테스트용 자동 플레이 (#bot)
function bossBot(dt){
  const B=G.B;if((G.botT=(G.botT||0)-dt)>0)return;G.botT=.09;
  if(B.ph==='qte1'&&B.qkey&&B.qt<B.qmax-.3)bossKey('Key'+B.qkey);
  if(B.ph==='qte2')bossKey('Space');
}
// 괴물 입 (벌어진 정도 open, 크기 s)
function drawMouth(x,y,s,open,teethOnly){
  const rx=16*1.75*s*(1+open*1.4),ry=8*1.75*s*(1+open*3.2);
  if(!teethOnly){ctx.fillStyle='#120802';ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle='#eedfa6';const n=7,tw=rx*2/n,th=Math.max(5,ry*.45);
  for(let i=0;i<n;i++){const tx=x-rx+tw*i+tw*.1;
    ctx.beginPath();ctx.moveTo(tx,y-ry*.85);ctx.lineTo(tx+tw*.8,y-ry*.85);ctx.lineTo(tx+tw*.4,y-ry*.85+th);ctx.fill();
    ctx.beginPath();ctx.moveTo(tx,y+ry*.85);ctx.lineTo(tx+tw*.8,y+ry*.85);ctx.lineTo(tx+tw*.4,y+ry*.85-th);ctx.fill()}
}
const BM=220; // 보스 방 그림 여백 (괴물이 커지면 카메라가 물러나며 보임)
function drawBoss(){
  const B=G.B,late=B.ph==='swallow'||B.ph==='after';
  // 커진 만큼 카메라가 물러남 (원래 모습으로 돌아오면 다시 다가감)
  const se=B.ph==='after'?B.scale+(1-B.scale)*ease(clamp((B.melt-.3)/.6,0,1)):B.scale,z=1/(1+(se-1)*.85);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

  ctx.translate(W/2,GY);ctx.scale(z,z);ctx.translate(-W/2,-GY);
  ctx.drawImage(BG.boss,-BM,-BM);
  // 창밖 비와 사이렌 불빛
  ctx.save();ctx.beginPath();ctx.rect(540,60,300,230);ctx.clip();
  ctx.strokeStyle='rgba(180,190,230,.25)';ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<40;i++){const x=540+((i*53+G.clock*90)%330),y=60+((i*97+G.clock*520)%250);ctx.moveTo(x,y);ctx.lineTo(x-4,y+14)}ctx.stroke();
  if(B.sirenOn){ctx.fillStyle=Math.sin(G.clock*7)>0?'rgba(255,30,40,.35)':'rgba(40,80,255,.35)';ctx.fillRect(540,60,300,230)}
  ctx.restore();
  // 문짝 (부서지면 바닥에 쓰러짐)
  if(!B.door){ctx.fillStyle='#2a1208';ctx.fillRect(DOOR_X-46,GY-213,92,213);ctx.fillStyle='#c8a050';ctx.fillRect(DOOR_X+30,GY-110,6,6)}
  else{ctx.fillStyle='#2a1208';ctx.save();ctx.translate(DOOR_X+60,GY);ctx.rotate(.06);ctx.fillRect(-10,-22,213,22);ctx.restore()}
  if(B.ph==='after'){ctx.fillStyle='rgba(92,58,26,.9)';ctx.beginPath();ctx.ellipse(B.monX,GY+6,(40+B.melt*120)*B.scale,8+B.melt*10,0,0,Math.PI*2);ctx.fill()}
  // 연인과 마르코스 (겁에 질려 떪). 지금 먹히는 사람은 괴물 위에 따로 그림
  const bs=biteState(),fear=B.ph==='talk'||B.ph==='qte2'||late;
  const vic=[[LOVER,B.lx],[MARCOS,B.mx]].map(([s,x],i)=>({s,i,x:x+(fear?(Math.random()-.5)*(late?5:2):0)}));
  for(const v of vic){if(B.eaten[v.i]||(bs&&bs.i===v.i))continue;
    drawChar(frames(v.s,-1)[0],v.x);
    if(v.s===MARCOS&&!late){ctx.fillStyle='rgba(255,130,50,.95)';ctx.beginPath();ctx.arc(v.x-24,GY-216,2.2,0,Math.PI*2);ctx.fill()} // 시가 불씨
  }
  ctx.drawImage(BG.desk,0,0);

  for(const g of B.guards){const spr=frames(g.aim?aimOf(g.spec):g.spec,g.face)[0];
    if(g.fly){const k=clamp(g.fly.t,0,1),x=g.x-k*520,fy=GY-Math.sin(k*Math.PI)*170;
      ctx.save();ctx.translate(x,fy-120);ctx.rotate(-k*5);ctx.translate(-x,-(fy-120));drawChar(spr,x,{y:fy,shadow:false,alpha:1-k*.3});ctx.restore()}
    else drawChar(spr,g.x)}
  // 괴물
  const mon=monSprite();
  const S=B.scale;
  if(B.ph==='after'){const k=B.melt,pl=frames(PLAYER,1)[0];
    if(k<.3)drawChar(mon,B.monX,{mud:k/.3,sx:S,sy:S});
    else if(k<.75){const m=(k-.3)/.45;drawChar(mon,B.monX,{base:0,mud:1,alpha:1-m,sx:S*(1-.45*m),sy:S*(1-.6*m),shadow:false});drawChar(pl,B.monX,{base:0,mud:1,alpha:m})}
    else drawChar(pl,B.monX,{mud:1-(k-.75)/.25});
  }else if(B.monA>0){
    const br=1+Math.sin(G.clock*2.2)*.012,bg=B.bulge,sx=S*br*(1+.14*bg*(1+Math.sin(G.clock*9)*.3)),sy=S*(1-.05*bg)/br;
    const rot=B.swing?-Math.sin(B.swing.t/.5*Math.PI)*.16:0,lean=bs?bs.open*28:0;
    ctx.save();ctx.translate(B.monX+lean,GY);ctx.rotate(rot+(bs?bs.open*.06:0));ctx.translate(-(B.monX+lean),-GY);
    if(B.monA<1)drawChar(monBlur(),B.monX+lean,{alpha:1-B.monA,shadow:false});
    drawChar(mon,B.monX+lean,{alpha:B.monA,sx,sy});
    // 한입에 삼키기: 크게 벌린 입 → 사람을 들어 올려 입속으로 → 꿀꺽
    if(bs){const mx=B.monX+lean+5*1.75*sx,my=GY-152*1.75*sy;
      drawMouth(mx,my,S,bs.open);
      if(bs.k<.62){const v=vic[bs.i],e=bs.e,sc=1-.6*e,x=v.x+(mx-v.x)*e,fy=GY+(my+140*sc-GY)*e;
        ctx.save();ctx.translate(x,fy-120*sc);ctx.rotate(Math.sin(G.clock*16)*.15*(1-e)+e*(bs.i?.9:-.9));ctx.translate(-x,-(fy-120*sc));
        ctx.translate(x,fy);ctx.scale(sc,sc);ctx.translate(-x,-fy);drawChar(frames(v.s,-1)[0],x,{y:fy,shadow:e<.1,alpha:1-clamp((e-.85)/.15,0,1)});ctx.restore()}
      drawMouth(mx,my,S,bs.open,true)}
    ctx.restore();
    if(B.swing){const k=B.swing.t/.5;ctx.strokeStyle=`rgba(150,95,45,${.7*(1-k)})`;ctx.lineWidth=16;ctx.lineCap='round';
      ctx.beginPath();ctx.arc(B.monX-30,GY-170,150,Math.PI*(.75+.6*k),Math.PI*(1.05+.6*k));ctx.stroke()}
  }
  // 총구 섬광, 진흙에 박히는 총알, 부서진 문 조각
  for(const s of B.shots){ctx.fillStyle='rgba(255,230,140,.95)';ctx.beginPath();ctx.arc(s.x,s.y,9,0,Math.PI*2);ctx.fill()}
  for(const h of B.hits){const a=1-h.t/.7;ctx.strokeStyle=`rgba(210,150,90,${a})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(h.x,h.y,4+h.t*34,2+h.t*14,0,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=`rgba(30,15,5,${a})`;ctx.beginPath();ctx.arc(h.x,h.y,3,0,Math.PI*2);ctx.fill()}
  for(const s of B.splinters){const x=s.x+s.vx*s.t,y=Math.min(GY-3,s.y+s.vy*s.t+400*s.t*s.t);ctx.save();ctx.translate(x,y);ctx.rotate(s.r+s.t*8);ctx.fillStyle='#3a1a0a';ctx.fillRect(-7,-2,14,4);ctx.restore()}
  ctx.restore();
  // 조명 깜빡임
  if(B.flick>0&&Math.random()<.5){ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(0,0,W,H)}
  ctx.drawImage(BG.vig,0,0);
  // 조작 표시
  if(B.ph==='qte1'&&B.qkey){const x=W/2,y=462,k=B.qt/B.qmax;
    ctx.fillStyle='rgba(8,4,6,.85)';ctx.strokeStyle='#ff3a4a';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x-42,y-42,84,84,10);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#ffd27a';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,56,-Math.PI/2,-Math.PI/2+Math.PI*2*k);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 46px '+FONT;ctx.textAlign='center';ctx.fillText(B.qkey,x,y+16)}
  if(B.ph==='qte2'&&B.done.has('a')){const x=W/2,y=446,pulse=1+Math.sin(G.clock*18)*.04;
    ctx.save();ctx.translate(x,y);ctx.scale(pulse,pulse);ctx.fillStyle='rgba(8,4,6,.85)';ctx.strokeStyle='#ff3a4a';ctx.lineWidth=3;
    ctx.beginPath();ctx.roundRect(-90,-26,180,52,10);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 30px '+FONT;ctx.textAlign='center';ctx.fillText('SPACE',0,11);ctx.restore();
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-150,y+40,300,12);ctx.fillStyle='#c0703a';ctx.fillRect(x-150,y+40,300*B.mash,12);
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x-150,y+56,300*clamp(B.mt/3,0,1),3)}
  if(G.bubble){const b=G.bubble;drawBubble(b.at(),b.mon?GY-356:GY-322,b.text,b.mon)}
  if(B.sub){ctx.fillStyle='#000';ctx.fillRect(0,0,W,56);ctx.fillRect(0,H-118,W,118);
    ctx.textAlign='center';ctx.font='22px '+FONT;ctx.fillStyle='#f0e6e6';ctx.fillText('“'+B.sub+'”',W/2,H-58)}
}

// ================= 엔딩: 빗속으로 사라짐 =================
const ENDLINES=(BAL.ending||[]).map((s,i)=>[4.4+i*2.7,s]); // 엔딩 독백 (근접 장면에서 차례로)
const PUDDLE_X=560;
function startEnding(){
  G.state='ending';G.en={t:0,x:110,step:0,sub:null};G.slots=[null,null,null,null];G.cool=0;G.morph=null;G.bubble=null;
  if(AU.c)AU.rain.gain.value=.09;
}
function endingUpdate(dt){
  const E=G.en;E.t+=dt;const t=E.t;rainUpdate(dt);
  if(t<3.4)E.x=110+(PUDDLE_X-90-110)*ease(clamp(t/3.2,0,1));
  if(t>2&&E.step===0){E.step=1;setLook(PLAYER)} // 변장이 풀려 맷으로
  if(t>5.6&&E.step===1){E.step=2;sfx('growl')}
  E.sub=null;for(const [at,s] of ENDLINES)if(t>=at&&t<at+2.6)E.sub=s;
  if(t>10.2)E.x=PUDDLE_X-90+(t-10.2)*150;
  if(t>14){G.state='theend';bgmOn(false)}
}
let RC=null; // 물웅덩이 근접 장면용 임시 캔버스
function drawEnding(){
  const E=G.en,t=E.t,close=t>=3.8&&t<9.8;
  if(!close){
    const gr=ctx.createLinearGradient(0,0,0,GY);gr.addColorStop(0,'#0a0810');gr.addColorStop(1,'#3a0c16');
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);tile(BG.far,.15);tile(BG.mid,.45);
    ctx.fillStyle='#0d0508';ctx.fillRect(0,GY,W,H-GY);ctx.fillStyle='#2a0f16';ctx.fillRect(0,GY,W,2);
    // 물웅덩이
    const pg=ctx.createRadialGradient(PUDDLE_X,GY+30,4,PUDDLE_X,GY+30,130);pg.addColorStop(0,'rgba(60,80,130,.55)');pg.addColorStop(1,'rgba(20,25,45,.2)');
    ctx.fillStyle=pg;ctx.beginPath();ctx.ellipse(PUDDLE_X,GY+30,130,18,0,0,Math.PI*2);ctx.fill();
    const moving=t<3.4||t>10.2;
    drawPlayer(E.x,moving?G.clock*1.3:0,1-clamp((t-11.6)/1.6,0,1));
    drawRain();ctx.drawImage(BG.fog,0,0);
    if(LIGHT.v>0){ctx.fillStyle=`rgba(220,225,255,${LIGHT.v*.35})`;ctx.fillRect(0,0,W,H)}
  }else{
    // 근접: 빗물 웅덩이에 비친 맷의 얼굴, 그 눈이 괴물의 눈으로 번뜩임
    const c=t-3.8,spr=frames(PLAYER,1)[0],k=5.4,hx=W/2,hy=H*.5,fy=hy+92*U*k,cx=hx-.5*U*k;
    if(!RC)RC=mk(W,H);const r=RC.getContext('2d');r.clearRect(0,0,W,H);
    r.drawImage(spr,cx-spr.width*k/2,fy-spr.height*k+spr.foot*k,spr.width*k,spr.height*k);
    const wg=ctx.createLinearGradient(0,0,0,H);wg.addColorStop(0,'#04060c');wg.addColorStop(1,'#0c1424');ctx.fillStyle=wg;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.6;for(let y=0;y<H;y+=6){const off=Math.sin(y*.045+G.clock*2.6)*5;ctx.drawImage(RC,0,y,W,6,off,y,W,6)}ctx.globalAlpha=1;
    ctx.fillStyle='rgba(20,40,90,.32)';ctx.fillRect(0,0,W,H);
    if(c>1.8){const a=clamp((c-1.8)/.8,0,1),ex=cx+1.8*U*k,ey=fy-93*U*k,sp=3*U*k;
      ctx.save();ctx.globalAlpha=a;ctx.shadowColor='#ffb300';ctx.shadowBlur=30;ctx.fillStyle='#ffe27a';
      for(const s of[-1,1]){const x=ex+s*sp;ctx.beginPath();ctx.moveTo(x-s*22,ey-8);ctx.lineTo(x+s*22,ey-16);ctx.lineTo(x+s*18,ey+6);ctx.lineTo(x-s*20,ey+4);ctx.closePath();ctx.fill()}
      ctx.restore()}
    // 빗방울 파문
    const R=rng(Math.floor(G.clock*6));ctx.strokeStyle='rgba(170,190,230,.35)';ctx.lineWidth=1.5;
    for(let i=0;i<14;i++){const px=R()*W,py=R()*H,rr=((G.clock*6)%1)*30+R()*10;ctx.beginPath();ctx.ellipse(px,py,rr,rr*.35,0,0,Math.PI*2);ctx.stroke()}
    ctx.drawImage(BG.vig,0,0);
    const f=Math.max(1-c/.5,clamp((c-5.5)/.5,0,1));if(f>0){ctx.fillStyle=`rgba(0,0,0,${f})`;ctx.fillRect(0,0,W,H)}
  }
  if(E.sub){ctx.fillStyle='#000';ctx.fillRect(0,0,W,56);ctx.fillRect(0,H-118,W,118);
    ctx.textAlign='center';ctx.font='22px '+FONT;ctx.fillStyle='#f0e6e6';ctx.fillText('“'+E.sub+'”',W/2,H-58)}
  const f0=Math.max(1-t/.8,clamp((t-12.6)/1.2,0,1));if(f0>0){ctx.fillStyle=`rgba(0,0,0,${f0})`;ctx.fillRect(0,0,W,H)}
}
function drawTheEnd(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  ctx.shadowColor='#ff2a3d';ctx.shadowBlur=24;ctx.fillStyle='#f0dcd0';ctx.font='bold 64px '+FONT;ctx.fillText('THE END',W/2,240);ctx.shadowBlur=0;
  ctx.font='15px '+FONT;ctx.fillStyle='#8a7a7a';ctx.fillText('Clayface_aScene — 비상업적 팬 오마주',W/2,286);
  ctx.globalAlpha=.45+.45*Math.sin(G.clock*3);ctx.font='18px '+FONT;ctx.fillStyle='#e8d8d8';ctx.fillText('PRESS SPACE',W/2,360);ctx.globalAlpha=1;
}

// ================= 입력 =================
function startStage(si,intro){newGame(si,'play');if(intro&&STG().intro&&STG().intro.length)startIntro();bgmOn(true)}
addEventListener('keydown',e=>{
  const c=e.code;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(c))e.preventDefault();
  if(e.repeat)return;
  audioInit();
  const S=G.state;
  if(c==='KeyM'){toggleMute();return}
  if(c==='KeyH'||c==='Slash'||(G.help&&c==='Escape')){if(S!=='stairs')toggleHelp();return}
  if(G.help)return;
  if(S==='title'&&(c==='Space'||c==='Enter')){if(STG().intro&&STG().intro.length)startIntro();else G.state=STG().boss?'boss':'play';bgmOn(true);return}
  if(S==='intro'){if(c==='Space'||c==='Enter')nextLine();if(c==='Escape'){G.state='play';G.dlg=null}return}
  if(S==='clear'&&(c==='Space'||c==='Enter'))return startStage(G.si+1,true);
  if(S==='theend'&&(c==='Space'||c==='Enter')){newGame(0,'title');return}
  if(S==='ending')return;
  if((S==='clear'||S==='over'||S==='play'||S==='boss')&&c==='KeyR')return startStage(G.si);
  if(S==='over'&&(c==='Space'||c==='Enter'))return startStage(G.si);
  if((S==='play'||S==='boss')&&(c==='KeyP'||c==='Escape')){G.prev=S;G.state='paused';bgmOn(false);return}
  if(S==='paused'&&(c==='KeyP'||c==='Escape'||c==='Space')){G.state=G.prev||'play';bgmOn(true);return}
  if(S==='boss')return bossKey(c);
  onKey(c);
});
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  audioInit();
  if(Math.hypot(x-SB.x,y-SB.y)<=SB.r+6)return toggleMute();
  if(G.state!=='stairs'&&(G.help||Math.hypot(x-HB.x,y-HB.y)<=HB.r+6))toggleHelp();
});
addEventListener('blur',()=>{if(G.state==='play'||G.state==='boss'){G.prev=G.state;G.state='paused';bgmOn(false)}});

// ================= 시작 =================
BG.far=makeLayer(5,'#1c0a12',110,280,false);BG.mid=makeLayer(9,'#11050a',160,330,true);BG.club=makeClub();
BG.dance=makeDance();BG.bar=makeBar();BG.corr=makeCorridor();BG.stair=makeStairwell();
BG.gbar=makeGate('bar');BG.gstaff=makeGate('staff');BG.fog=makeFog();BG.vig=makeVignette();
BG.gtape=makeEscapeGate('tape');BG.gexit=makeEscapeGate('exit');
BG.boss=makeBossRoom();BG.desk=makeDesk();
newGame(clamp((+HP.get('stage')||1)-1,0,STAGES.length-1),HP.has('play')?'play':'title');
if(HP.has('help'))G.help=true;
if(HP.has('tclock'))G.clock=+HP.get('tclock'); // 테스트용: 타이틀 연출 시점
if(HP.has('intro')){startIntro();G.dlg.i=+HP.get('intro')||0;G.dlg.t=1}
if(HP.has('stairs')){G.look=G.npcs.find(n=>n.spec.mafia)?.spec||GUARD;startStairs()}
if(HP.has('sim')){const T=+HP.get('sim');while(G.clock<T&&['intro','play','end','stairs','boss','ending'].includes(G.state))update(1/60);document.title='SIM '+G.state+(G.overMsg?' / '+G.overMsg:'');
  if(HP.has('morph')){onKey('Space');onKey('KeyA');if(G.morph)G.morph.t=+HP.get('morph')}
  if(HP.has('crack')){G.look=G.npcs[G.npcs.length-1].spec;frames(G.look,1);G.hard=+HP.get('crack')}}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(G.state!=='paused'&&!G.help)update(dt);render();requestAnimationFrame(loop)}
if(HP.has('sim'))render();else requestAnimationFrame(loop);
window.__G=()=>G;
</script>
